[project]
name = "bitacora-financiera"
version = "1.3.0"
description = "Bitácora Financiera Personal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "icon.png"
]
