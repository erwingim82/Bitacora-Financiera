name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop & Config Java
        run: |
          flutter config --enable-linux-desktop

      - name: Install Flet CLI and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.26.0,<1.0.0"
          pip install .

      - name: Build APK with Flet
        run: |
          flet build apk --yes --verbose --output build/apk --python-version 3.12 --build-number ${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/apk/**/*.apk
            build/**/*.apk
