name: Compilar Bitácora APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Aceptar licencias de Android
        run: |
          mkdir -p /home/runner/android-sdk/licenses
          echo "d56f5187479451eabf01fb78af6dfcb137a64640" > /home/runner/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/android-sdk/licenses/android-sdk-preview-license
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK con Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-apk
          path: build/apk/*.apk
